{% import "macros.html.jinja" as macros %}

<table id="jobs" class="table-auto">
    <thead>
        <tr>
            <th>UUID</th>
            <th>Date</th>
            <th>Status</th>
            <th>Tags</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for job in jobs %}
        <tr>
            <td class="font-monospace"><a href="/jobs/{{ job.id }}" class="underline text-sky-600 hover:no-underline hover:text-sky-400">{{ job.id }}</a></td>
            <td class="font-monospace">{{ job.timestamp.strftime("%Y-%m-%d %H:%M:%S") }}</td>
            <td>{{ macros.status(job.status) }}</td>
            <td>{% for tag in job.tags %}#{{ tag }} {% endfor %}</td>
            <td>
                <button type="button" class="underline text-sky-600 hover:no-underline hover:text-sky-400"
                    onclick="navigator.clipboard.writeText('{{ job.path }}')">Copy Path</button>
                <a href="/tensorboard/open/{{ job.id }}" target="_blank"
                    class="underline text-sky-600 hover:no-underline hover:text-sky-400">Tensorboard</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.js"></script>
<script>
    $(document).ready(function () {
        $('#jobs').DataTable({
            "order": [[1, 'desc']],
        });
    });
</script>
